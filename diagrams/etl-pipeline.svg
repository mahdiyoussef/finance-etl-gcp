<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">Finance ETL pipeline</title>
  <desc id="desc">Batch and streaming ETL flow from source data to governed analytical marts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#5f6368"/></marker>
  </defs>
  <rect width="1400" height="600" fill="url(#bg)"/>
  <text x="50" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#202124">Finance ETL and ELT flow</text>
  <text x="50" y="83" font-family="Arial,sans-serif" font-size="16" fill="#5f6368">Idempotent batch ingestion plus event-time support streaming</text>
  <g font-family="Arial,sans-serif" font-size="16" text-anchor="middle" filter="url(#shadow)">
    <g><rect x="40" y="150" width="170" height="90" rx="12" fill="#fff" stroke="#4285f4" stroke-width="2"/><circle cx="125" cy="180" r="20" fill="#4285f4"/><text x="125" y="187" fill="#fff" font-weight="700">SRC</text><text x="125" y="220" fill="#202124" font-weight="700">ERP / Kaggle</text></g>
    <g><rect x="260" y="150" width="170" height="90" rx="12" fill="#fff" stroke="#34a853" stroke-width="2"/><circle cx="345" cy="180" r="20" fill="#34a853"/><text x="345" y="187" fill="#fff" font-weight="700">GCS</text><text x="345" y="220" fill="#202124" font-weight="700">Landing</text></g>
    <g><rect x="480" y="150" width="170" height="90" rx="12" fill="#fff" stroke="#fbbc04" stroke-width="2"/><circle cx="565" cy="180" r="20" fill="#fbbc04"/><text x="565" y="187" fill="#202124" font-weight="700">AF</text><text x="565" y="220" fill="#202124" font-weight="700">Airflow</text></g>
    <g><rect x="700" y="150" width="170" height="90" rx="12" fill="#fff" stroke="#ea4335" stroke-width="2"/><circle cx="785" cy="180" r="20" fill="#ea4335"/><text x="785" y="187" fill="#fff" font-weight="700">BQ</text><text x="785" y="220" fill="#202124" font-weight="700">Raw tables</text></g>
    <g><rect x="920" y="150" width="170" height="90" rx="12" fill="#fff" stroke="#7e57c2" stroke-width="2"/><circle cx="1005" cy="180" r="20" fill="#7e57c2"/><text x="1005" y="187" fill="#fff" font-weight="700">DB</text><text x="1005" y="220" fill="#202124" font-weight="700">dbt core/marts</text></g>
    <g><rect x="1140" y="150" width="210" height="90" rx="12" fill="#fff" stroke="#673ab7" stroke-width="2"/><circle cx="1245" cy="180" r="20" fill="#673ab7"/><text x="1245" y="187" fill="#fff" font-weight="700">BI</text><text x="1245" y="220" fill="#202124" font-weight="700">Dashboards / ML</text></g>
  </g>
  <g stroke="#5f6368" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M210 195 H260"/><path d="M430 195 H480"/><path d="M650 195 H700"/><path d="M870 195 H920"/><path d="M1090 195 H1140"/></g>
  <g font-family="Arial,sans-serif">
    <rect x="95" y="350" width="520" height="150" rx="14" fill="#e8f0fe" stroke="#4285f4"/><text x="125" y="385" font-size="20" font-weight="700" fill="#174ea6">Batch path</text><text x="125" y="420" font-size="15" fill="#202124">Download manifest → stream CSV batches</text><text x="125" y="447" font-size="15" fill="#202124">Normalize → validate → quarantine → deduplicate</text><text x="125" y="474" font-size="15" fill="#202124">Build marts → quality gate → dbt freshness/build</text>
    <rect x="785" y="350" width="520" height="150" rx="14" fill="#e6f4ea" stroke="#34a853"/><text x="815" y="385" font-size="20" font-weight="700" fill="#137333">Streaming path</text><text x="815" y="420" font-size="15" fill="#202124">Pub/Sub ticket events → Dataflow/Beam</text><text x="815" y="447" font-size="15" fill="#202124">Event-time validation → windowing → late data</text><text x="815" y="474" font-size="15" fill="#202124">BigQuery event fact + structured dead-letter records</text>
  </g>
  <path d="M785 240 V320" stroke="#ea4335" stroke-width="2" marker-end="url(#arrow)"/><path d="M565 240 V320 H615" stroke="#fbbc04" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
