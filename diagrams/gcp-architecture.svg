<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Finance ETL GCP architecture</title>
  <desc id="desc">GCP service architecture for invoice, payment, and support cost intelligence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".15"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#5f6368"/></marker>
  </defs>
  <rect width="1400" height="760" fill="url(#bg)"/>
  <text x="60" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#202124">Finance ETL on Google Cloud</text>
  <text x="60" y="88" font-family="Arial,sans-serif" font-size="16" fill="#5f6368">Governed invoice-to-cash and support-cost intelligence platform</text>

  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <rect x="55" y="140" width="210" height="130" rx="14" fill="#fff" stroke="#4285f4" stroke-width="2"/>
    <rect x="75" y="160" width="42" height="42" rx="9" fill="#4285f4"/><text x="96" y="189" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">G</text>
    <text x="75" y="228" font-size="18" font-weight="700" fill="#202124">Source systems</text><text x="75" y="251" font-size="14" fill="#5f6368">ERP, FX API, tickets</text>

    <rect x="320" y="140" width="210" height="130" rx="14" fill="#fff" stroke="#34a853" stroke-width="2"/>
    <rect x="340" y="160" width="42" height="42" rx="9" fill="#34a853"/><text x="361" y="189" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">GCS</text>
    <text x="340" y="228" font-size="18" font-weight="700" fill="#202124">Cloud Storage</text><text x="340" y="251" font-size="14" fill="#5f6368">Landing and manifests</text>

    <rect x="585" y="140" width="210" height="130" rx="14" fill="#fff" stroke="#fbbc04" stroke-width="2"/>
    <rect x="605" y="160" width="42" height="42" rx="9" fill="#fbbc04"/><text x="626" y="189" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">AF</text>
    <text x="605" y="228" font-size="18" font-weight="700" fill="#202124">Cloud Composer</text><text x="605" y="251" font-size="14" fill="#5f6368">Airflow orchestration</text>

    <rect x="850" y="140" width="210" height="130" rx="14" fill="#fff" stroke="#ea4335" stroke-width="2"/>
    <rect x="870" y="160" width="42" height="42" rx="9" fill="#ea4335"/><text x="891" y="189" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">BQ</text>
    <text x="870" y="228" font-size="18" font-weight="700" fill="#202124">BigQuery</text><text x="870" y="251" font-size="14" fill="#5f6368">Raw, core, marts</text>

    <rect x="1115" y="140" width="230" height="130" rx="14" fill="#fff" stroke="#673ab7" stroke-width="2"/>
    <rect x="1135" y="160" width="42" height="42" rx="9" fill="#673ab7"/><text x="1156" y="189" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">LS</text>
    <text x="1135" y="228" font-size="18" font-weight="700" fill="#202124">Looker Studio</text><text x="1135" y="251" font-size="14" fill="#5f6368">Executive dashboards</text>
  </g>

  <g stroke="#5f6368" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M265 205 H320"/><path d="M530 205 H585"/><path d="M795 205 H850"/><path d="M1060 205 H1115"/>
  </g>

  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <rect x="190" y="390" width="230" height="130" rx="14" fill="#fff" stroke="#00acc1" stroke-width="2"/>
    <rect x="212" y="410" width="42" height="42" rx="9" fill="#00acc1"/><text x="233" y="439" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">PS</text>
    <text x="212" y="478" font-size="18" font-weight="700" fill="#202124">Pub/Sub</text><text x="212" y="501" font-size="14" fill="#5f6368">Ticket event stream</text>

    <rect x="490" y="390" width="230" height="130" rx="14" fill="#fff" stroke="#ff7043" stroke-width="2"/>
    <rect x="512" y="410" width="42" height="42" rx="9" fill="#ff7043"/><text x="533" y="439" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">DF</text>
    <text x="512" y="478" font-size="18" font-weight="700" fill="#202124">Dataflow</text><text x="512" y="501" font-size="14" fill="#5f6368">Beam validation and DLQ</text>

    <rect x="790" y="390" width="230" height="130" rx="14" fill="#fff" stroke="#7e57c2" stroke-width="2"/>
    <rect x="812" y="410" width="42" height="42" rx="9" fill="#7e57c2"/><text x="833" y="439" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">DB</text>
    <text x="812" y="478" font-size="18" font-weight="700" fill="#202124">dbt</text><text x="812" y="501" font-size="14" fill="#5f6368">Tests and transformations</text>
  </g>
  <g stroke="#5f6368" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M420 455 H490"/><path d="M720 455 H850 V270"/><path d="M795 455 H720"/>
  </g>

  <g font-family="Arial,sans-serif">
    <rect x="55" y="625" width="1290" height="70" rx="12" fill="#fff" stroke="#dadce0"/>
    <text x="80" y="654" font-size="15" font-weight="700" fill="#202124">Cross-cutting controls</text>
    <text x="80" y="678" font-size="14" fill="#5f6368">Terraform • IAM/WIF • Dataplex quality • Policy tags • Cloud Monitoring • budgets • Secret Manager</text>
  </g>
</svg>
