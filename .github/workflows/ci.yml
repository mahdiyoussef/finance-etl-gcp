name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m compileall -q src dags scripts
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform/envs/dev fmt -check -recursive
      - run: terraform -chdir=terraform/envs/dev init -backend=false
      - run: terraform -chdir=terraform/envs/dev validate
      - run: terraform -chdir=terraform/envs/prod init -backend=false
      - run: terraform -chdir=terraform/envs/prod validate
