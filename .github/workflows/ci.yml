name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install pytest
      - run: python -m pytest tests/ -v
        env:
          PYTHONPATH: .
      - run: python -m compileall -q pipeline dags scripts
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform/envs/dev fmt -check -recursive
      - run: terraform -chdir=infra/terraform/envs/dev init -backend=false
      - run: terraform -chdir=infra/terraform/envs/dev validate
      - run: terraform -chdir=infra/terraform/envs/prod init -backend=false
      - run: terraform -chdir=infra/terraform/envs/prod validate
