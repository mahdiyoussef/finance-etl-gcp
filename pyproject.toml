[project]
name = "finance-etl"
version = "0.1.0"
description = "GCP Finance ETL: Invoice-to-Cash & Support Cost Intelligence"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "config*"]

[project.scripts]
finance-etl = "pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.optional-dependencies]
dev = ["pytest"]
