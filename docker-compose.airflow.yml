services:
  airflow:
    image: apache/airflow:2.10.5-python3.12
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      FINPULSE_ROOT: /opt/airflow/data/finpulse
      PYTHONPATH: /opt/airflow/project/src:/opt/airflow/project
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./scripts:/opt/airflow/project/scripts
      - ./dbt:/opt/airflow/project/dbt
      - ./data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs

volumes:
  airflow_logs:
